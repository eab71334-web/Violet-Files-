name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot + export templates
        run: |
          V=${GODOT_VERSION}
          B=https://github.com/godotengine/godot/releases/download/${V}-stable
          wget -q $B/Godot_v${V}-stable_linux.x86_64.zip
          wget -q $B/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q Godot_v${V}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.1" "build-tools;34.0.0" "platforms;android-35" > /dev/null
          mkdir -p ~/.config/godot
          MM=$(echo ${GODOT_VERSION} | cut -d. -f1,2)
          for f in editor_settings-4.tres editor_settings-${MM}.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOS
          done

      - name: Debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import + export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/VioletFiles.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: VioletFiles-Android
          path: build/VioletFiles.apk
